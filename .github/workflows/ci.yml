name: CI

# Every push to main and every pull request into main. A release (release.yml) ships only a
# tagged commit whose push run here passed on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only reads: nothing here writes to the repository (each job may only narrow this).
permissions:
  contents: read

# A newer push to a pull request supersedes its older run. A run on main is never cancelled: a
# release ships only a commit whose run here passed, so every main commit needs one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, lint and typecheck: the whole repository, once; and the client's build and tests.
  checks:
    name: Format, Lint, Typecheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # --fail-if-no-match: a filter that matches nothing would otherwise pass silently.
      - name: Build client
        run: pnpm --filter @orbinum-ceremony/client --fail-if-no-match build

      # The client's unit tests need no real input (core's fixtures are in the repository).
      - name: Test client
        run: pnpm --filter @orbinum-ceremony/client --fail-if-no-match test

  # The test suites in parallel, each with only the inputs it reads. The packages' tests do not
  # depend on each other's, so nothing waits for another; the cli runs its files one at a time
  # (fileParallelism: false), so it is split into shards here.
  # The circuits repo at the release the test ceremonies announce, with its tags (the
  # verification resolves them) and its locked node_modules installed later (circomlib). The
  # organisation disables deploy keys, so a fine-grained token reads it: Contents read-only, that
  # repo only. It is cloned in this job alone, which runs no code of this repository nor any
  # dependency, so no later step can read the token from the runner's memory; the test jobs get
  # the tree as an artifact. Its origin stays the plain HTTPS URL the verification compares with
  # the announced repo. It is checked out by the commit the tests pin (v0.17.1,
  # packages/cli/tests/support/ceremony.ts; a test keeps the two equal), never by a ref name
  # someone could move.
  circuits:
    name: Clone the circuits repo
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the circuits repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: orbinum/circuits
          ref: 05e7d6fa7cde898b34b30d522a1fb38cfcafb5e7 # v0.17.1
          token: ${{ secrets.CIRCUITS_READ_TOKEN }}
          persist-credentials: false
          path: circuits
          fetch-depth: 0
          fetch-tags: true

      - name: Hand the clone to the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: circuits
          path: circuits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test ${{ matrix.name }}
    needs: circuits
    runs-on: ubuntu-24.04
    # The end-to-end ceremony alone takes ~8 min (wrangler dev, nine verifications, a real drand
    # round); the bound only stops a hung run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core, coordinator
            run: pnpm --filter @orbinum-ceremony/core --filter @orbinum-ceremony/coordinator test
            inputs: true
          - name: verifier
            run: pnpm --filter @orbinum-ceremony/verifier test
            inputs: true
          - name: cli 1/3
            run: pnpm --filter @orbinum-ceremony/cli exec vitest run --shard=1/3
            inputs: true
            tools: true
          - name: cli 2/3
            run: pnpm --filter @orbinum-ceremony/cli exec vitest run --shard=2/3
            inputs: true
            tools: true
          - name: cli 3/3
            run: pnpm --filter @orbinum-ceremony/cli exec vitest run --shard=3/3
            inputs: true
            tools: true
          - name: e2e
            run: pnpm --filter @orbinum-ceremony/e2e test
            inputs: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"
          cache: pnpm

      # The circuits repo, cloned by its own job: no secret is referenced in this one.
      - name: The circuits repo
        if: matrix.tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: circuits
          path: .test-inputs/circuits

      # Install scripts run only for esbuild and workerd (pnpm-workspace.yaml), which
      # `wrangler dev` needs in the end-to-end test.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every real-key test runs here, not only locally: the suites skip them without
      # ORBINUM_PTAU / ORBINUM_REHEARSAL_DIR, and a suite that skips them would be green by
      # absence, indistinguishable from green by passing. The script checks each input
      # against its pin and prints the environment; the cache key is the script, where the
      # URLs and pins live.
      - name: Cache test inputs
        if: matrix.inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .test-inputs/*.ptau
            .test-inputs/*.tar.gz
          key: test-inputs-${{ hashFiles('.github/scripts/fetch-test-inputs.sh') }}

      - name: Fetch test inputs
        if: matrix.inputs
        run: .github/scripts/fetch-test-inputs.sh >> "$GITHUB_ENV"

      # The vk_hash packer, built at a pinned commit with a pinned lockfile, so the strict
      # verification tests run here too (about a minute). Only the registry and downloaded
      # crates are cached, written only by runs on main (a pull request's cache stays in its
      # own scope); cargo checks checksums when it downloads a crate, not when it reuses a cached
      # one. The clone, the extracted sources and the build are never restored from a cache.
      - name: Cache the vk packer dependencies
        if: matrix.tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: vk-packer-deps-${{ hashFiles('.github/scripts/build-vk-packer.sh', '.github/scripts/pack-verifying-key.Cargo.lock') }}

      - name: Build the vk packer
        if: matrix.tools
        run: .github/scripts/build-vk-packer.sh >> "$GITHUB_ENV"

      # The independent Rust verifier and circom, pinned by SHA-256.
      - name: Fetch the Rust verifier and circom
        if: matrix.tools
        run: |
          .github/scripts/fetch-ci-tools.sh >> "$GITHUB_ENV"
          echo "$PWD/.test-inputs/bin" >> "$GITHUB_PATH"

      # The clone is data: no install scripts, no .pnpmfile.cjs (pnpm loads it at startup, whatever
      # --ignore-scripts says), and no switch to the pnpm version its package.json names.
      - name: Install the circuits dependencies
        if: matrix.tools
        run: |
          pnpm --dir .test-inputs/circuits install --frozen-lockfile --ignore-scripts --ignore-workspace \
            --ignore-pnpmfile --config.manage-package-manager-versions=false
          echo "ORBINUM_CIRCUITS_REPO=$PWD/.test-inputs/circuits" >> "$GITHUB_ENV"

      # Every input a suite reads is present, so nothing skips: a missing one fails the CI
      # sentinel test of core, verifier or the cli. The end-to-end finalization waits for a real drand round.
      - name: Test
        run: ${{ matrix.run }}
        env:
          ORBINUM_E2E_LIVE_DRAND: "1"

  security:
    name: Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      # No pnpm cache here: `pnpm audit` only reads the lockfile, nothing is installed, and
      # setup-node fails the job when the store it should save does not exist.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"

      # Blocking: this code verifies and coordinates the ceremony, and a known-vulnerable
      # dependency in it is a finding. Transitive fixes go in pnpm-workspace.yaml `overrides`.
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          # The pull request's base, or the previous head of the pushed branch
          # (none on a branch's first push, when every commit is scanned).
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          head: HEAD
          extra_args: --only-verified
          # The action runs a container image by this tag (default `latest`): pinned to the action.
          version: 3.99.2

      # trufflehog above fails only on secrets it can verify live; the ceremony's own keys
      # (session and verifier HMAC keys, OAuth, Turnstile and Access secrets) are not among them.
      # gitleaks scans the whole history with .gitleaks.toml: its default rules plus those keys.
      # The binary is pinned by version and SHA-256 (from the release's checksums file).
      - name: Check for ceremony secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs: [checks, test, security]
    if: always()
    steps:
      # Reports the actual result, not just "failed": a cancelled job means
      # something cancelled this run, which is a very different bug from a test
      # going red, and saying "checks failed" for it sends whoever reads this
      # straight to the wrong place.
      - name: Check status
        run: |
          status=0
          for job in checks:${{ needs.checks.result }} test:${{ needs.test.result }} security:${{ needs.security.result }}; do
            name=${job%%:*}
            result=${job#*:}
            case "$result" in
              success)   echo "✅ ${name}: passed." ;;
              cancelled) echo "::error::${name} was cancelled — another run superseded this one."; status=1 ;;
              skipped)   echo "::error::${name} never ran."; status=1 ;;
              *)         echo "::error::${name} checks failed (${result})."; status=1 ;;
            esac
          done
          exit $status
