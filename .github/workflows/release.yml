name: Release

# One signed `vX.Y.Z` tag per release, cut from main. Each network's ceremony is its own
# deployment (`env.<network>` in packages/coordinator/wrangler.jsonc: Worker, Durable Object,
# buckets, secrets, domain), built from the same tag:
#
#   - Tag push → testnet: the tagged commit must already be green in CI on main; the client is
#     built and the coordinator deployed with `wrangler deploy --env testnet`; GitHub release with
#     the client bundle.
#   - Dispatch with version=X.Y.Z → mainnet: the same tag deployed with `--env mainnet`, its
#     bundle added to the same release. Only for a version testnet already shipped.
#
# The Worker's own secrets are set once per network with `wrangler secret put` (README), never
# here. A failed run is retried with "Re-run failed jobs".
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to ship to mainnet, e.g. 0.2.0 (git tag v0.2.0, already on testnet)"
        required: true
        type: string

# No token rights by default: each job asks for what it needs.
permissions: {}

# Never cancel a release in flight: a run killed between the deploy and the release leaves the
# two out of step.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the mainnet gate reads the release assets
      actions: read # the testnet gate reads the CI run of the tagged commit
    outputs:
      version: ${{ steps.meta.outputs.version }}
      network: ${{ steps.meta.outputs.network }}
      sha: ${{ steps.signature.outputs.sha }}
    steps:
      # Credentials kept: the private repository's tag and main are fetched again below. This job
      # runs only its own shell steps, with a read-only token.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Version and network
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            NETWORK="mainnet" # mainnet is only ever a promotion
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            NETWORK="testnet" # a tag push always targets testnet
          fi
          # The whole value, not one of its lines: it reaches shells and GITHUB_OUTPUT.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "📦 v$VERSION → $NETWORK"

      # Anyone with push access can create a tag; only the release key can sign one.
      - name: Verify the tag's GPG signature
        id: signature
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          if [[ -z "$RELEASE_GPG_PUBLIC_KEY" ]]; then
            echo "::error::the RELEASE_GPG_PUBLIC_KEY secret is not set"; exit 1
          fi
          echo "$RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG" --force
          git verify-tag "refs/tags/$TAG"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"

      # Trunk-based: a release is a commit that is on main.
      - name: Tag must be on main
        env:
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main \
            || { echo "::error::$TAG is not on main: tag a commit of main"; exit 1; }

      # Read at the tag: a promotion's checkout is main.
      - name: The root package.json at the version, with its CHANGELOG section
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          # One version for the whole repository, in the root manifest only (packages stay 0.0.0):
          # the client, the CLI and the verifier all report it.
          V=$(git show "refs/tags/$TAG:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [[ "$V" != "$VERSION" ]]; then
            echo "::error::package.json is at $V at $TAG: bump it to $VERSION before tagging"
            exit 1
          fi
          git show "refs/tags/$TAG:CHANGELOG.md" | grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" \
            || { echo "::error::CHANGELOG.md at $TAG has no '## [$VERSION] - YYYY-MM-DD' section"; exit 1; }

      # What ships passed CI on main first: merge, wait for green, then tag. A promotion skips
      # this; its testnet release already went through it.
      - name: Tagged commit must have passed CI on main
        if: steps.meta.outputs.network == 'testnet'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push" \
            --jq '.workflow_runs[0] | select(.) | "\(.status) \(.conclusion) \(.html_url)"')
          read -r STATUS CONCLUSION URL <<< "$RUN"
          if [[ -z "$RUN" ]]; then
            echo "::error::no CI run on main for $TAG ($SHA): merge it to main and let CI pass before tagging"; exit 1
          elif [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI on main for $TAG is still $STATUS ($URL): re-run this job once it is green"; exit 1
          elif [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI on main for $TAG concluded '$CONCLUSION' ($URL): fix main and tag a new version"; exit 1
          fi
          echo "✅ CI green on main for $SHA: $URL"

      # Mainnet only ships a version testnet already ran.
      - name: Mainnet requires the testnet release
        if: steps.meta.outputs.network == 'mainnet'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ASSET="ceremony-client-$VERSION-testnet.tar.gz"
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$ASSET" \
            || { echo "::error::release v$VERSION has no $ASSET: ship v$VERSION to testnet before mainnet"; exit 1; }

  deploy:
    name: Deploy ${{ needs.metadata.outputs.network }}
    runs-on: ubuntu-24.04
    needs: metadata
    # The GitHub environment of the network: its Cloudflare credentials, and for mainnet any
    # required reviewers set on it.
    environment: ${{ needs.metadata.outputs.network }}
    permissions:
      contents: write # the GitHub release
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      NETWORK: ${{ needs.metadata.outputs.network }}
    steps:
      # By the commit metadata verified, also on a promotion: a tag name can move after the check.
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false

      - name: The checkout is the verified commit
        env:
          SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SHA" ]] \
            || { echo "::error::the checkout is not the verified commit $SHA"; exit 1; }

      # Without it wrangler would deploy the top-level (local) configuration.
      - name: The network's deployment must be configured
        run: |
          grep -Eq "^    \"$NETWORK\": \{" packages/coordinator/wrangler.jsonc \
            || { echo "::error::wrangler.jsonc has no env.$NETWORK at v$VERSION: add it before shipping to $NETWORK"; exit 1; }

      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"
          cache: pnpm

      # As in CI: only esbuild and workerd may run install scripts (pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the client
        run: pnpm --filter @orbinum-ceremony/client --fail-if-no-match build

      # From inside dist/, so the tarball unpacks straight into a web root.
      - name: Package the client bundle
        run: |
          tar -czf "ceremony-client-$VERSION-$NETWORK.tar.gz" -C packages/client/dist .
          sha256sum "ceremony-client-$VERSION-$NETWORK.tar.gz" | tee "checksums-$VERSION-$NETWORK.txt"

      # The Worker serves the bundle just built (assets) and keeps its secrets: wrangler refuses
      # a deploy while a required one is missing.
      - name: Deploy the coordinator (env.${{ env.NETWORK }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm --filter @orbinum-ceremony/coordinator exec wrangler deploy --env "$NETWORK" \
            --message "v$VERSION" | tee deploy.log

      - name: Release notes
        run: |
          # The section for this version, by exact heading: the first "## [" is [Unreleased].
          awk -v tag="## [$VERSION]" '
            index($0, tag) == 1  { flag = 1; next }
            flag && /^## \[/     { exit }
            flag && /^\[[^]]+\]:/{ exit }   # link definitions end the section
            flag
          ' CHANGELOG.md > release_notes_body.md
          [ -s release_notes_body.md ] || echo "- Release generated from CI." > release_notes_body.md
          if [[ "$NETWORK" == "mainnet" ]]; then
            STATUS="Live on **mainnet** and testnet."
          else
            STATUS="Live on **testnet**. Ship to mainnet with \`gh workflow run release.yml -f version=$VERSION\`."
          fi
          VERSION_ID=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | tail -1 | cut -d' ' -f4 || true)
          {
            echo "$STATUS"
            echo ""
            cat release_notes_body.md
            echo ""
            echo "## Deploy"
            echo ""
            echo "- $NETWORK: \`wrangler deploy --env $NETWORK\`${VERSION_ID:+, Worker version \`$VERSION_ID\`}"
            echo "- Client: \`ceremony-client-$VERSION-$NETWORK.tar.gz\`"
          } > release_notes.md

      # Idempotent: updates the existing release, so mainnet adds its bundle next to testnet's.
      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            ceremony-client-${{ env.VERSION }}-${{ env.NETWORK }}.tar.gz
            checksums-${{ env.VERSION }}-${{ env.NETWORK }}.txt
